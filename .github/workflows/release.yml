name: Build Windows

# 仅构建 Windows x64 安装包（NSIS）。
# 每次推送到 main / master 都会构建，并根据 package.json 的版本号决定是否发版：
# - v<版本号> 尚不存在 Release：自动打 tag、创建 Release 并附带安装包
# - 该版本已发布过：只上传构建产物（Artifact），可在 Actions 页面下载
# 发版流程：修改 package.json 的 version（并在 UPDATELOGS.md 写对应版本说明）→ push
# 手动触发时可勾选 force_release，强制重新发布并覆盖已有 Release 的安装包
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_release:
        description: "即使该版本已存在 Release 也重新发布（覆盖安装包）"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          FORCE="${{ inputs.force_release }}"
          if [ "$EXISTS" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION 已存在 Release，本次只构建产物，不重复发版。"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "将发布 v$VERSION。"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version
        run: bun run sync-version

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "当前版本: $VERSION"

          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" UPDATELOGS.md)

          if [ -z "$BODY" ]; then
            BODY="Windows 构建版本 v$VERSION"
            echo "未在 UPDATELOGS.md 中找到 [$VERSION] 的更新记录，使用默认说明。"
          else
            echo "已提取更新说明。"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-launcher-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: SillyTavern Launcher GUI v${{ steps.release.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          target_commitish: ${{ github.sha }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
