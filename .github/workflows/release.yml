name: Build Windows

# 仅构建 Windows x64 安装包（NSIS）。
# - 推送到 main / 手动触发：只上传构建产物（Artifact），可到 Actions 页面下载
# - 推送 v* 标签：额外创建 GitHub Release 并附带安装包
on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install

      - name: Sync version
        run: bun run sync-version

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "当前版本: $VERSION"

          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" UPDATELOGS.md)

          if [ -z "$BODY" ]; then
            BODY="Windows 构建版本 v$VERSION"
            echo "未在 UPDATELOGS.md 中找到 [$VERSION] 的更新记录，使用默认说明。"
          else
            echo "已提取更新说明。"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-launcher-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SillyTavern Launcher GUI ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
